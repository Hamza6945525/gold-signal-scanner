name: Download XAUUSD Candle Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-candles:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Download XAUUSD 5M data
        run: |
          curl -L \
            "https://raw.githubusercontent.com/getdata-finance/xauusd-5m-ohlcv-metals-historical-data/main/XAUUSD_5m.csv" \
            -o XAUUSD_5m.csv

      - name: Check downloaded file
        run: |
          ls -lh XAUUSD_5m.csv
          head -5 XAUUSD_5m.csv

      - name: Save candle data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add XAUUSD_5m.csv
          git diff --cached --quiet || git commit -m "Add XAUUSD 5M candle data"
          git push
