<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold Signal Scanner</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px;
    }

    h1 {
      text-align: center;
      color: #f5c542;
    }

    .status {
      text-align: center;
      margin: 15px 0;
      padding: 12px;
      background: #172033;
      border-radius: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .card {
      background: #141e30;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #26344d;
    }

    .label {
      color: #9aa8bd;
      font-size: 14px;
    }

    .value {
      font-size: 25px;
      font-weight: bold;
      margin-top: 8px;
    }

    button {
      display: block;
      margin: 25px auto;
      padding: 13px 25px;
      border: none;
      border-radius: 8px;
      background: #f5c542;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    .note {
      margin-top: 25px;
      padding: 15px;
      background: #172033;
      border-radius: 10px;
      color: #b8c3d4;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🥇 Gold Signal Scanner</h1>

  <div class="status" id="status">
    Loading market data...
  </div>

  <div class="grid">

    <div class="card">
      <div class="label">XAUUSD / Gold Price</div>
      <div class="value" id="price">---</div>
    </div>

    <div class="card">
      <div class="label">Open</div>
      <div class="value" id="open">---</div>
    </div>

    <div class="card">
      <div class="label">High</div>
      <div class="value" id="high">---</div>
    </div>

    <div class="card">
      <div class="label">Low</div>
      <div class="value" id="low">---</div>
    </div>

    <div class="card">
      <div class="label">Close</div>
      <div class="value" id="close">---</div>
    </div>

    <div class="card">
      <div class="label">High-Low Change</div>
      <div class="value" id="change">---</div>
    </div>

  </div>

  <button onclick="loadMarketData()">
    🔄 Refresh Data
  </button>

  <div class="note">
    Market data dashboard — educational analysis only.
  </div>

</div>

<script>

async function loadMarketData() {

  const status = document.getElementById("status");

  status.textContent = "Loading market data...";

  try {

    const response = await fetch(
      "market-data.json?t=" + new Date().getTime()
    );

    if (!response.ok) {
      throw new Error("market-data.json could not be loaded");
    }

    const data = await response.json();

    console.log("Market Data:", data);

    document.getElementById("open").textContent =
      data.open ?? "---";

    document.getElementById("high").textContent =
      data.high ?? "---";

    document.getElementById("low").textContent =
      data.low ?? "---";

    document.getElementById("close").textContent =
      data.close ?? "---";

    document.getElementById("price").textContent =
      data.close ?? "---";

    document.getElementById("change").textContent =
      data.highLowChangePercent != null
        ? data.highLowChangePercent + "%"
        : "---";

    status.textContent = "✅ Market data loaded successfully";

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Could not load market data";

  }

}

loadMarketData();

</script>

</body>
</html>
